spring.application.name=${SPRING_APP_NAME:SpringSecSection04}

#console logging pattern
spring.output.ansi.enabled=${SPRING_OUTPUT_ANSI_ENABLED:ALWAYS}
logging.pattern.console=${LOG_PATTERN_CONSOLE:%clr(%d{HH:mm:ss.SSS}){green} %highlight(%-5level) %clr([%thread]){cyan} %clr(%logger{36}){yellow} %clr(-){faint} %msg%n}

#set logging level to TRACE
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

#database configuration
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:ddgbank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_HIBERNATE_FORMAT_SQL:true}

